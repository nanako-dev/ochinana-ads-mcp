[project]
name = "ochinana-ads-mcp"
version = "0.17.1"
description = "OCHINANA の広告運用セット（読む道具・点検・見込み・知識ベース・計算の道具）"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mcp>=1.10", "google-ads>=28"]

[project.scripts]
ochinana-ads = "ochinana_ads.server:main"
ochinana-ads-connect = "ochinana_ads.connect:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ochinana_ads*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
